# =============================================================================
# VolDesk configuration
# Every market number here is a PLAUSIBLE LEVEL, not live data.
# >>> CHECK AND UPDATE spot, rates and vols against a current screen when you can. <<<
# Units: rates and vols in PERCENT (3.5 = 3.5%), RR/BF in vol points.
# =============================================================================

llm:
  model: claude-sonnet-5-5          # model used for marking and debriefs
  max_tokens: 16000
  effort: medium                  # low | medium | high (marking needs care, not depth)
  refusal_fallbacks: true         # server-side fallback model if a request is declined
  cache_db: data/llm_cache.sqlite

storage:
  progress_db: data/voldesk.sqlite

# ---------------------------------------------------------------------------
# Interest rates (continuously compounded, flat across tenors unless a curve is
# given under rate_curves). CHECK AND UPDATE.
# ---------------------------------------------------------------------------
rates:
  USD: 3.60
  EUR: 2.00
  JPY: 0.75
  GBP: 3.60
  AUD: 3.35
  NZD: 2.50
  CAD: 2.25
  CHF: 0.00

# Optional per-tenor overrides, e.g. to price in a cut: {USD: {1M: 3.6, 1Y: 3.2}}
rate_curves: {}

# ---------------------------------------------------------------------------
# Spot fallbacks (used if the live snapshot fails). Crosses are always built
# from these USD legs so everything is triangularly consistent. CHECK AND UPDATE.
# ---------------------------------------------------------------------------
spot_fallback:
  EURUSD: 1.1600
  USDJPY: 152.00
  GBPUSD: 1.3200
  AUDUSD: 0.6600
  NZDUSD: 0.5800
  USDCAD: 1.3900
  USDCHF: 0.8000

live_spot:
  enabled: true
  url: https://api.frankfurter.app/latest?from=USD
  timeout_s: 4

# ---------------------------------------------------------------------------
# Vol surface defaults. Per pair: ATM, 25d RR and 25d BF per tenor.
# RR = vol(25d call on base) - vol(25d put on base). BF = smile strangle:
#   vol25C = ATM + BF + RR/2 ; vol25P = ATM + BF - RR/2
# 10d quotes default to multiples of the 25d ones (override with rr10/bf10).
# Tenors: ON 1W 2W 1M 2M 3M 6M 9M 1Y. CHECK AND UPDATE.
# ---------------------------------------------------------------------------
tenors: ["ON", 1W, 2W, 1M, 2M, 3M, 6M, 9M, 1Y]

smile_defaults:
  rr10_mult: 1.85
  bf10_mult: 3.4
  sabr_beta: 1.0
  sabr_tol_vol: 0.15        # max wing error (vol pts) before vanna-volga fallback

vols:
  EURUSD:
    atm:  [6.6, 6.8, 6.9, 7.1, 7.2, 7.3, 7.5, 7.6, 7.7]
    rr25: [0.10, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.40]
    bf25: [0.12, 0.12, 0.13, 0.15, 0.17, 0.19, 0.22, 0.24, 0.25]
  USDJPY:
    atm:  [9.0, 9.3, 9.5, 9.8, 9.9, 10.0, 10.2, 10.3, 10.4]
    rr25: [-0.8, -0.9, -1.0, -1.2, -1.35, -1.5, -1.8, -1.95, -2.1]
    bf25: [0.18, 0.18, 0.20, 0.23, 0.26, 0.29, 0.34, 0.36, 0.38]
  GBPUSD:
    atm:  [6.9, 7.1, 7.2, 7.4, 7.5, 7.6, 7.8, 7.9, 8.0]
    rr25: [-0.15, -0.2, -0.2, -0.25, -0.3, -0.35, -0.45, -0.5, -0.55]
    bf25: [0.13, 0.13, 0.14, 0.16, 0.18, 0.20, 0.23, 0.25, 0.26]
  AUDUSD:
    atm:  [8.6, 8.9, 9.0, 9.3, 9.4, 9.5, 9.7, 9.8, 9.9]
    rr25: [-0.4, -0.45, -0.5, -0.6, -0.7, -0.8, -0.95, -1.05, -1.1]
    bf25: [0.15, 0.15, 0.16, 0.18, 0.20, 0.22, 0.26, 0.28, 0.29]
  NZDUSD:
    atm:  [9.2, 9.4, 9.5, 9.7, 9.8, 9.9, 10.1, 10.2, 10.3]
    rr25: [-0.4, -0.45, -0.5, -0.6, -0.7, -0.8, -0.95, -1.05, -1.1]
    bf25: [0.16, 0.16, 0.17, 0.19, 0.21, 0.23, 0.27, 0.29, 0.30]
  USDCAD:
    atm:  [4.8, 5.0, 5.1, 5.3, 5.4, 5.5, 5.7, 5.8, 5.9]
    rr25: [0.15, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
    bf25: [0.10, 0.10, 0.11, 0.12, 0.13, 0.14, 0.16, 0.17, 0.18]
  USDCHF:
    atm:  [6.9, 7.1, 7.2, 7.4, 7.5, 7.6, 7.8, 7.9, 8.0]
    rr25: [-0.4, -0.45, -0.5, -0.6, -0.7, -0.8, -0.9, -1.0, -1.05]
    bf25: [0.14, 0.14, 0.15, 0.17, 0.19, 0.21, 0.24, 0.26, 0.27]
  EURJPY:
    atm:  [8.8, 9.1, 9.3, 9.6, 9.7, 9.8, 10.0, 10.1, 10.2]
    rr25: [-0.9, -1.0, -1.1, -1.3, -1.45, -1.6, -1.9, -2.05, -2.2]
    bf25: [0.18, 0.18, 0.20, 0.23, 0.26, 0.29, 0.34, 0.36, 0.38]
  EURGBP:
    atm:  [4.6, 4.7, 4.8, 5.0, 5.1, 5.2, 5.4, 5.5, 5.6]
    rr25: [0.10, 0.10, 0.12, 0.15, 0.18, 0.20, 0.25, 0.28, 0.30]
    bf25: [0.09, 0.09, 0.10, 0.11, 0.12, 0.13, 0.15, 0.16, 0.17]
  EURCHF:
    atm:  [4.8, 5.0, 5.1, 5.3, 5.4, 5.5, 5.7, 5.8, 5.9]
    rr25: [-0.5, -0.55, -0.6, -0.7, -0.8, -0.9, -1.0, -1.1, -1.15]
    bf25: [0.12, 0.12, 0.13, 0.15, 0.17, 0.19, 0.22, 0.24, 0.25]

# Equity index used occasionally in the options drills (Black-Scholes with div yield)
equity_index:
  name: SPX
  spot: 6000
  rate: 3.60
  div_yield: 1.30
  atm_vol: 16.0
  skew_per_10pct: -3.5      # vol change per 10% moneyness (strongly negative skew)

# ---------------------------------------------------------------------------
# Rates engine defaults (Section 2). CHECK AND UPDATE.
# Zero rates in percent at pillar years (continuous comp).
# ---------------------------------------------------------------------------
rates_engine:
  curves:
    SONIA: {0.25: 3.55, 0.5: 3.45, 1: 3.30, 2: 3.25, 3: 3.30, 5: 3.50, 7: 3.75, 10: 4.05, 20: 4.55, 30: 4.60}
    SOFR:  {0.25: 3.65, 0.5: 3.55, 1: 3.40, 2: 3.30, 3: 3.35, 5: 3.50, 7: 3.70, 10: 3.95, 20: 4.35, 30: 4.40}
  swaption_normal_vol_bp: 85
  boe_bank_rate: 3.75
  fed_funds_mid: 3.625
  futures_notional_coupon: 6.0

# ---------------------------------------------------------------------------
# Simulator (Section 3)
# ---------------------------------------------------------------------------
simulator:
  session_minutes: 10
  days: 10
  tick_seconds: 1.5
  ticks_per_day: 40
  vol_hours_per_day: 1.0        # 1 simulated day passes per real minute
  quote_timeout_s: [12, 20]     # countdown range for an RFQ
  spot_spread_pips:             # interdealer spot hedge spread (full width)
    EURUSD: 0.3
    USDJPY: 0.4
    GBPUSD: 0.5
    AUDUSD: 0.4
    NZDUSD: 0.6
    USDCAD: 0.5
    USDCHF: 0.6
    EURJPY: 0.7
    EURGBP: 0.6
    EURCHF: 0.8
  idb_vol_spread:               # interdealer vol bid/offer width (vol pts), by tenor
    "ON": 1.0
    1W: 0.6
    2W: 0.5
    1M: 0.35
    2M: 0.3
    3M: 0.25
    6M: 0.25
    9M: 0.25
    1Y: 0.25
  stress_spread_mult: 2.5       # spreads multiply by up to this in a crisis

  levels:
    1:
      pairs: 1
      rfq_rate_per_day: 4
      burst_prob: 0.0
      pause: true
      news_preannounced: true
      limit_mult: 2.0
      exaggeration: 1.0
    2:
      pairs: 3
      rfq_rate_per_day: 7
      burst_prob: 0.05
      pause: false
      news_preannounced: false
      limit_mult: 1.0
      exaggeration: 1.3
    3:
      pairs: 10
      rfq_rate_per_day: 12
      burst_prob: 0.12
      pause: false
      news_preannounced: false
      limit_mult: 0.6
      exaggeration: 1.7

  # Base limits (USD). Multiplied by the level's limit_mult.
  limits:
    delta_usd_per_pair: 50000000      # |delta| in USD equivalent
    gamma_usd_per_pct: 25000000       # |change in delta (USD) per 1% spot|
    vega_usd_per_pair: 150000         # |vega per vol pt| per pair
    total_vega_usd: 400000
    breach_penalty_usd_per_tick: 2000

  # Regimes (all CHECK AND TUNE to taste):
  #   drift_pct_session: size of the trend over the whole session (% of spot) in the trending regime
  #   rv_iv_ratio: realised spot vol / implied ATM vol, sampled per pair per session
  #   jumps_per_session: expected spot jumps per currency over the session
  #   jump_size_pct: mean absolute jump size (% of spot)
  #   vol_of_vol_pts_day: 1-sd daily move of the ATM vol level (vol points)
  #   vol_mean_shift: vol points the ATM level drifts towards (e.g. risk-off = higher vol)
  #   skew_shift: RR shift (vols) towards each pair's risk-off direction
  #   corr_mult: multiplier on the pair's spot/vol correlation, sampled per session
  regimes:
    calm:
      drift_pct_session: 0.0
      rv_iv_ratio: [0.70, 0.90]
      jumps_per_session: 0.3
      jump_size_pct: 0.4
      vol_of_vol_pts_day: 0.20
      vol_mean_shift: -0.4
      skew_shift: 0.0
      corr_mult: [0.8, 1.1]
    trending:
      drift_pct_session: 3.0
      rv_iv_ratio: [0.95, 1.20]
      jumps_per_session: 0.6
      jump_size_pct: 0.5
      vol_of_vol_pts_day: 0.30
      vol_mean_shift: 0.5
      skew_shift: 0.3
      corr_mult: [0.9, 1.3]
    risk_off:
      drift_pct_session: 0.0
      rv_iv_ratio: [1.20, 1.60]
      jumps_per_session: 2.0
      jump_size_pct: 0.9
      vol_of_vol_pts_day: 0.80
      vol_mean_shift: 3.0
      skew_shift: 1.0
      corr_mult: [1.1, 1.6]
    cb_week:
      drift_pct_session: 0.0
      rv_iv_ratio: [0.80, 1.05]
      jumps_per_session: 0.5
      jump_size_pct: 0.5
      vol_of_vol_pts_day: 0.35
      vol_mean_shift: 0.5
      skew_shift: 0.2
      corr_mult: [0.7, 1.2]
    intervention:
      drift_pct_session: 1.5
      rv_iv_ratio: [1.00, 1.30]
      jumps_per_session: 0.8
      jump_size_pct: 0.7
      vol_of_vol_pts_day: 0.50
      vol_mean_shift: 1.5
      skew_shift: 0.6
      corr_mult: [0.5, 1.5]     # sometimes the usual correlation breaks down

  # Scheduled events: currency, typical 1-sd surprise move (% of spot), name
  events:
    USD: [["US CPI", 0.55], ["FOMC decision", 0.8], ["US payrolls", 0.6]]
    EUR: [["ECB decision", 0.6], ["Euro-area flash CPI", 0.35]]
    JPY: [["BoJ decision", 1.0], ["Tokyo CPI", 0.35]]
    GBP: [["BoE decision", 0.6], ["UK CPI", 0.45]]
    AUD: [["RBA decision", 0.6], ["Australian jobs report", 0.45]]
    NZD: [["RBNZ decision", 0.7]]
    CAD: [["BoC decision", 0.5]]
    CHF: [["SNB decision", 0.7]]
  events_per_session: {calm: 2, trending: 2, risk_off: 2, cb_week: 5, intervention: 2}

  # Pair-specific spot/vol dynamics.
  # spot_vol_corr: corr between spot returns and ATM vol changes (base-currency view).
  #   USDJPY negative: USD down / JPY up goes with vol up (carry unwind).
  # rr_beta: how many RR vol pts the 1M 25d RR moves per 1 vol pt ATM move.
  # vol_mean_rev: speed (per year) of ATM mean reversion.
  # risk_off_dir: sign of the base-currency move in a risk-off shock.
  pair_dynamics:
    EURUSD: {spot_vol_corr: 0.10,  rr_beta: 0.10,  vol_mean_rev: 6.0, risk_off_dir: -1}
    USDJPY: {spot_vol_corr: -0.55, rr_beta: -0.35, vol_mean_rev: 6.0, risk_off_dir: -1}
    GBPUSD: {spot_vol_corr: -0.30, rr_beta: -0.15, vol_mean_rev: 6.0, risk_off_dir: -1}
    AUDUSD: {spot_vol_corr: -0.50, rr_beta: -0.25, vol_mean_rev: 6.0, risk_off_dir: -1}
    NZDUSD: {spot_vol_corr: -0.45, rr_beta: -0.25, vol_mean_rev: 6.0, risk_off_dir: -1}
    USDCAD: {spot_vol_corr: 0.35,  rr_beta: 0.15,  vol_mean_rev: 6.0, risk_off_dir: 1}
    USDCHF: {spot_vol_corr: -0.35, rr_beta: -0.20, vol_mean_rev: 6.0, risk_off_dir: -1}
    EURJPY: {spot_vol_corr: -0.55, rr_beta: -0.35, vol_mean_rev: 6.0, risk_off_dir: -1}
    EURGBP: {spot_vol_corr: 0.15,  rr_beta: 0.10,  vol_mean_rev: 6.0, risk_off_dir: 1}
    EURCHF: {spot_vol_corr: -0.45, rr_beta: -0.25, vol_mean_rev: 6.0, risk_off_dir: -1}

  # Correlation of daily spot returns across currencies (vs USD) used to build
  # correlated shocks. Positive = move together against USD.
  ccy_corr:
    EUR: {GBP: 0.65, CHF: 0.75, JPY: 0.35, AUD: 0.55, NZD: 0.55, CAD: 0.40}
    GBP: {CHF: 0.50, JPY: 0.25, AUD: 0.55, NZD: 0.50, CAD: 0.40}
    CHF: {JPY: 0.55, AUD: 0.30, NZD: 0.30, CAD: 0.25}
    JPY: {AUD: 0.05, NZD: 0.05, CAD: 0.05}
    AUD: {NZD: 0.85, CAD: 0.55}
    NZD: {CAD: 0.50}

  clients:
    corporate:   {weight: 0.35, informed: 0.0, size_mult: 1.0,  noise_vol: 0.20}
    real_money:  {weight: 0.25, informed: 0.0, size_mult: 2.0,  noise_vol: 0.15}
    macro_hf:    {weight: 0.20, informed: 0.6, size_mult: 1.5,  noise_vol: 0.10}
    leveraged:   {weight: 0.20, informed: 0.2, size_mult: 0.7,  noise_vol: 0.25}
  base_notional_musd: [10, 25, 50, 75, 100]
